version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Base de Datos Central PostgreSQL (Fuente operativa y de Power BI)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: diagnostico_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: diagnostico_ti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/views_powerbi.sql:/docker-entrypoint-initdb.d/02_views.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diagnostico_ti"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Backend FastAPI (Inferencia de Machine Learning y Persistencia)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: diagnostico_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: diagnostico_ti
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_SSLMODE: disable
      ALLOW_SQLITE_FALLBACK: "false"
      MODEL_PATH: 03_MODELO/mejor_modelo_diagnostico_fallas.joblib
      METADATA_PATH: backend/ml/metadata.json
      POWERBI_DASHBOARD_URL: https://app.powerbi.com
    ports:
      - "8000:8000"

  # ----------------------------------------------------------------------------
  # 3. Frontend Web React + Vite (Servido con Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diagnostico_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
    driver: local
