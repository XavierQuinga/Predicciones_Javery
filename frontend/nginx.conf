resolver [fd12::10] valid=10s ipv6=on;
resolver_timeout 5s;

server {
    listen 80;
    server_name localhost;

    # Railway reemplaza este alias por backend-javery.railway.internal al iniciar.
    # Al usar una variable, Nginx vuelve a resolver el DNS y no conserva una IP
    # interna obsoleta después de un redeploy del backend.
    set $backend_upstream "http://backend:8000";

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy dinámico a la API del backend.
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Dashboard HTML servido por FastAPI; requerido también en producción.
    location = /dashboard-inteligente {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
